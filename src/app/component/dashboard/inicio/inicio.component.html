<mat-card class="card">
  <mat-toolbar>
    <span>Dashboard</span>
    <span class="example-spacer"></span>
    <button
      class="agregar"
      routerLink="/dashboard/crearelemento"
      mat-raised-button
      color="primary"
    >
      Agregar
    </button>
  </mat-toolbar>

  <div class="canvas-container">
    <canvas
      baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [plugins]="barChartPlugins"
      [legend]="barChartLegend"
      [type]="'bar'"
    >
    </canvas>
  </div>

  <mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" #input />
  </mat-form-field>

  <mat-paginator
    [length]="dataSource.data.length"
    [pageSize]="5"
    [pageSizeOptions]="[5, 10, 25, 100]"
    aria-label="Select page"
  ></mat-paginator>
  <div class="table-container mat-elevation-z8" *ngIf="listProduct.length > 0">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>fecha</th>
        <td mat-cell *matCellDef="let element">{{ element.fecha }}</td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>stock</th>
        <td mat-cell *matCellDef="let element">{{ element.stock }}</td>
      </ng-container>

      <ng-container matColumnDef="ventas">
        <th mat-header-cell *matHeaderCellDef>ventas</th>
        <td mat-cell *matCellDef="let element">{{ element.ventas }}</td>
      </ng-container>

      <ng-container matColumnDef="producto">
        <th mat-header-cell *matHeaderCellDef>productos</th>
        <td mat-cell *matCellDef="let element">{{ element.producto }}</td>
      </ng-container>

      <ng-container matColumnDef="Action">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element" style="text-align: right">
          <a routerLink="/dashboard/chart">
            <mat-icon
              aria-hidden="false"
              style="color: black"
              aria-label="Example home icon"
              fontIcon="analytics"
              matTooltip="charts"
            ></mat-icon>
          </a>
          <a style="color: red">
            <mat-icon
              aria-hidden="false"
              (click)="eliminarProducto(element.id)"
              aria-label="Example home icon"
              fontIcon="delete"
              matTooltip="Delete"
            ></mat-icon>
          </a>
          <a href="#">
            <mat-icon
              aria-hidden="false"
              aria-label="Example home icon"
              fontIcon="edit"
              matTooltip="Edit"
            ></mat-icon>
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <h2 *ngIf="listProduct.length === 0" style="color: white">
    no hay usuarios para mostrar
  </h2>
</mat-card>
